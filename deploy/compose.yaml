# brain: no internet route at all (internal network). Out: only via `egress` allowlist.
# In: only via `ingress` -> `web` (voice UI + pass-through to the brain API). The brain publishes no port.
#   cd deploy && cp ../.env.example .env && docker compose up -d --build
services:
  brain:
    build: { context: .., dockerfile: deploy/Dockerfile }
    env_file: .env
    environment:
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
    volumes: ["../data:/data"]
    networks: [sealed]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped

  web:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["fern-web", "--host", "0.0.0.0", "--port", "8766"]
    environment:  # explicit: the interface gets no device tokens, no HA token, no household data
      OPENAI_API_KEY: ${FERN_WEB_OPENAI_KEY:-${OPENAI_API_KEY}}
      FERN_BRAIN_URL: http://brain:8765
      FERN_REALTIME_MODEL: ${FERN_REALTIME_MODEL:-gpt-realtime-2.1-mini}
      FERN_REALTIME_VOICE: ${FERN_REALTIME_VOICE:-marin}
      FERN_VOICE_DAILY_MINUTES: ${FERN_VOICE_DAILY_MINUTES:-30}
      FERN_VOICE_MAX_OUTPUT_TOKENS: ${FERN_VOICE_MAX_OUTPUT_TOKENS:-600}
      FERN_VOICE_CONTEXT_TOKENS: ${FERN_VOICE_CONTEXT_TOKENS:-4000}
      FERN_BRIDGE_URL: http://builder:8770
      FERN_BRIDGE_TOKEN: ${FERN_BRIDGE_TOKEN:-}
      FERN_CLAUDE_DEVICES: ${FERN_CLAUDE_DEVICES:-}  # device names allowed to switch to Claude; empty = all
      HTTPS_PROXY: http://egress:8888
      NO_PROXY: brain,builder
    networks: [sealed]
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    restart: unless-stopped

  # Claude Code CLI on your Pro/Max plan + the bridge fern_web talks to. Has no GitHub token and can't see .env
  # or data/; Claude's own processes get only CLAUDE_CODE_OAUTH_TOKEN (fern_builder/claude_cli.py CHILD_ENV).
  builder:
    build: { context: .., dockerfile: deploy/Dockerfile.builder }
    command: ["fern-bridge", "--host", "0.0.0.0", "--port", "8770"]
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      FERN_CLAUDE_MODEL: ${FERN_CLAUDE_MODEL:-sonnet}
      FERN_BRIDGE_TOKEN: ${FERN_BRIDGE_TOKEN:-}
      FERN_SHIPPER_TOKEN: ${FERN_SHIPPER_TOKEN:-}
      FERN_SHIPPER_URL: http://shipper:8771
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: shipper
    volumes: ["builder-workspace:/workspace", "builder-state:/state"]
    networks: [sealed]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped

  # The only container with the GitHub token. Owns the git clones; only pushes claude/* branches.
  shipper:
    build: { context: .., dockerfile: deploy/Dockerfile.builder }
    command: ["fern-shipper", "--host", "0.0.0.0", "--port", "8771"]
    environment:
      FERN_BUILDER_GITHUB_TOKEN: ${FERN_BUILDER_GITHUB_TOKEN:-}
      FERN_GITHUB_REPO: ${FERN_GITHUB_REPO:-aikokik/fern}
      FERN_SHIPPER_TOKEN: ${FERN_SHIPPER_TOKEN:-}
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
    volumes: ["builder-workspace:/workspace", "shipper-repos:/repos"]
    networks: [sealed]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped

  egress:
    build:
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache tinyproxy
        USER nobody
        CMD ["tinyproxy", "-d", "-c", "/etc/tinyproxy/tinyproxy.conf"]
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./allowlist:/etc/tinyproxy/allowlist:ro
    networks: [sealed, outside]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  ingress:
    image: alpine/socat:1.8.0.0
    command: TCP-LISTEN:8766,fork,reuseaddr TCP:web:8766
    ports: ["${FERN_BIND:-127.0.0.1}:${FERN_PORT:-8766}:8766"]  # reach it via `tailscale serve`, not the LAN
    networks: [sealed, outside]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  builder-workspace: {}
  builder-state: {}
  shipper-repos: {}

networks:
  sealed: { internal: true }
  outside: {}
