<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="fern">
  <meta name="theme-color" content="#0f1b16">
  <title>fern</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-state="idle" data-who="fern">
  <main class="canvas">
    <header class="topbar">
      <h1>fern <span id="mode" class="mode-chip" hidden>Claude</span></h1>
      <nav class="header-links">
        <button id="show-transcript" class="icon" aria-label="Transcript" title="Transcript">≡</button>
        <a href="/usage">Usage</a>
        <button id="settings" class="icon" aria-label="Device token" title="Device token">⚙</button>
      </nav>
    </header>

    <form id="token-form" class="sheet" hidden>
      <p id="token-status" class="muted"></p>
      <label for="token">Device token</label>
      <input id="token" type="password" autocomplete="off" placeholder="paste the phone= value from .env">
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" id="forget-token" class="ghost" hidden>Forget</button>
      </div>
    </form>

    <!-- Moments: everything fern or Claude shows (answers, photos, recipes, questions, approvals) floats in here. -->
    <section id="moments" aria-live="polite">
      <div id="welcome" class="welcome">
        <p class="welcome-title">Tap the orb and talk.</p>
        <p class="muted">Try “show me pictures of pad thai”, “how do I make pancakes for 4?” or “open Claude”.</p>
      </div>
    </section>

    <footer class="dock">
      <p id="caption" class="caption" aria-live="polite"></p>
      <div class="controls">
        <button id="mute" class="ghost round" hidden aria-label="Mute">🎙</button>
        <button id="orb" aria-label="Start talking"><span class="aura"></span><span class="core"></span></button>
        <button id="end" class="ghost round" hidden aria-label="End">✕</button>
      </div>
      <p id="status" class="status">Tap to talk</p>
    </footer>

    <aside id="transcript" class="drawer" hidden>
      <header class="drawer-head"><strong>Transcript</strong><button id="close-transcript" class="icon" aria-label="Close">✕</button></header>
      <ol id="transcript-lines"></ol>
    </aside>
    <div id="lightbox" class="lightbox" hidden><img id="lightbox-image" alt=""></div>
  </main>
  <audio id="remote" autoplay></audio>
  <script src="/static/app.js"></script>
</body>
</html>
