<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="fern">
  <meta name="theme-color" content="#ffffff">
  <title>fern</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-state="idle" data-who="fern">
  <main class="canvas">
    <header class="topbar"><button id="who" class="who" aria-label="Claude activity">fern</button></header>

    <!-- Shown only when this browser has no device token yet, or fern rejected the saved one. -->
    <form id="token-form" class="sheet" hidden>
      <p id="token-status" class="muted"></p>
      <label for="token">Device token</label>
      <input id="token" type="password" autocomplete="off" placeholder="paste the phone= value from .env">
      <div class="row">
        <button type="submit">Save</button>
        <button type="button" id="forget-token" class="ghost" hidden>Forget</button>
      </div>
    </form>

    <!-- Moments: answers, photos, recipes, questions and approvals float in here. -->
    <section id="moments" aria-live="polite"></section>

    <footer class="dock">
      <p id="caption" class="caption" aria-live="polite"></p>
      <div class="controls">
        <span class="spacer" aria-hidden="true"></span>
        <button id="orb" aria-label="Start talking"><span class="aura"></span><span class="core"></span></button>
        <button id="end" class="ghost round" hidden aria-label="End">✕</button>
      </div>
      <p id="status" class="status">Tap to talk</p>
    </footer>
    <!-- Claude activity: what Claude Code reported for each run, live (tap the fern / Claude label). -->
    <aside id="activity" class="activity" hidden aria-label="Claude activity">
      <header class="activity-head"><strong>Claude activity</strong><button id="close-activity" class="ghost round" aria-label="Close">✕</button></header>
      <div id="activity-source" class="activity-source"></div>
      <ol id="runs"></ol>
    </aside>
    <div id="lightbox" class="lightbox" hidden><img id="lightbox-image" alt=""></div>
  </main>
  <audio id="remote" autoplay></audio>
  <script src="/static/app.js"></script>
</body>
</html>
