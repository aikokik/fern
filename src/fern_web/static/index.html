<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="fern">
  <meta name="theme-color" content="#10201a">
  <title>fern</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header><h1>fern</h1><button id="settings" class="ghost" aria-label="Device token">⚙</button></header>

    <form id="token-form" hidden>
      <label for="token">Device token</label>
      <input id="token" type="password" autocomplete="off" placeholder="paste the phone= value from .env">
      <button type="submit">Save</button>
    </form>

    <section id="stage">
      <button id="mic" aria-label="Start talking"><span></span></button>
      <p id="status">Tap to talk</p>
      <button id="mute" class="ghost" hidden>Mute</button>
    </section>

    <section id="cards" aria-live="polite"></section>
    <section id="log" aria-live="polite"></section>
  </main>
  <audio id="remote" autoplay></audio>
  <script src="/static/app.js"></script>
</body>
</html>
